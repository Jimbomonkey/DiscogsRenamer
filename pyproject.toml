[project]
name = "discogsrenamer"
description = """
A PyQt6-based desktop application that automates renaming audio files in a folder
using tracklisting data from a selected Discogs release
"""
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = ["pyqt6>=6.9.1", "python3-discogs-client>=2.8"]

[project.optional-dependencies]
dev = [
    "black>=25.1.0",
    "pyinstaller>=6.19.0",
    "pytest>=8.4.1",
    "pytest-qt>=4.5.0",
]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.setuptools.dynamic]
version = { attr = "discogsrenamer.version.version" }
